name: Lean formalization

on:
  push:
    branches:
      - main
      - formalize-algebraic-number-closure
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The committed lake-manifest.json pins Mathlib and every transitive
      # Lake dependency to exact git revisions. Do not run "lake update" in CI:
      # that would turn verification into a dependency-refresh operation.
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: ProofAudit
