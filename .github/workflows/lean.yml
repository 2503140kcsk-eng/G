name: Lean formalization

on:
  push:
    branches:
      - main
      - formalize-algebraic-number-closure
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lean-action requires a Lake manifest. Bootstrap Elan and generate it
      # from the pinned toolchain and pinned Mathlib tag.
      - name: Bootstrap Lean workspace
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          axiom-audit: true
