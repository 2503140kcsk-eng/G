name: Lean formalization

on:
  push:
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lean proofs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Avoid lean-action's moving elan-init.sh -> releases/latest/download
      # bootstrap URL. Pin the installer to a concrete, published release.
      - name: Install pinned Elan
        shell: bash
        run: |
          set -euo pipefail
          elan_version="v4.2.4"
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/leanprover/elan/releases/download/${elan_version}/elan-x86_64-unknown-linux-gnu.tar.gz"

          curl --fail --location --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 300 \
            "$url" --output "$archive"

          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$archive" -C "$RUNNER_TEMP/elan"
          test -x "$RUNNER_TEMP/elan/elan-init"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(cat lean/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          cd lean
          lean --version
          lake --version

      - name: Resolve dependencies and fetch the matching Mathlib cache
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Build and fail on warnings
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          lake build --wfail

      # Lean 4.35+ ships lake check and independent proof checkers.
      # --paranoid requires acceptance by Lean's kernel and every bundled checker,
      # and rejects non-standard axioms (including sorryAx and custom axioms).
      - name: Kernel replay and paranoid axiom audit
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          lake check --paranoid
